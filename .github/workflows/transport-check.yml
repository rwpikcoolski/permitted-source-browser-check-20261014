name: Vista anonymous public catalog scope
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install official browser dependency
        run: npm install --ignore-scripts --no-package-lock playwright@1.64.1
      - name: Check unfiltered public catalog without record data
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const result={purpose:'Validate anonymous Enterprise Portal public inventory without organization or keyword restriction',checkedAt:new Date().toISOString(),maximumBrowserSeconds:70,maximumSourceRequests:1,sourceRequests:0,browserClosed:false,rawRecordsLogged:false,tests:[]};let browser,timer;
          try{
           browser=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true});timer=setTimeout(()=>void browser.close().catch(()=>{}),70000);const context=await browser.newContext({acceptDownloads:false});const page=await context.newPage();
           const control=await page.goto('https://ipwho.is/',{waitUntil:'domcontentloaded',timeout:18000});const n=await control.json();if(control.status()!==200||n.success!==true||n.country_code!=='US'||Number(n.connection?.asn)===13335||/cloudflare/i.test(String(n.connection?.org||'')))throw Error('USA_NOT_VERIFIED');result.countryVerified='US';result.independentOfCloudflare=true;
           const url=new URL('https://gis.vista.gov/portal/sharing/rest/search');url.search=new URLSearchParams({f:'json',q:'access:public',num:'100',start:'1',sortField:'modified',sortOrder:'desc'});result.sourceRequests++;
           const r=await context.request.get(url.href,{timeout:18000,maxRedirects:0});const out={label:'anonymous-enterprise-public-catalog',httpStatus:r.status(),retryAfter:r.headers()['retry-after']||null,query:'access:public',organizationRestriction:false,keywordRestriction:false};result.tests.push(out);if([401,403,406,429].includes(r.status())||out.retryAfter){out.controlRespected=true;throw Error('SOURCE_CONTROL');}
           const text=await r.text();if(text.length>1500000)throw Error('SIZE');const j=JSON.parse(text);if(j.error){out.error={code:j.error.code,message:j.error.message};if([401,403,498,499].includes(j.error.code)){out.controlRespected=true;throw Error('SOURCE_CONTROL');}}
           out.total=j.total;out.start=j.start;out.nextStart=j.nextStart;out.returned=j.results?.length;out.publicOnly=j.results?.every(x=>x.access==='public');out.relevantItems=(j.results||[]).filter(x=>/permit|building|cityworks|vista.?gis/i.test(x.title||'')).map(x=>({id:x.id,title:x.title,type:x.type,access:x.access}));
          }catch(e){const m=String(e?.message||'');result.failure=/USA_NOT_VERIFIED/.test(m)?'USA-not-verified':/SOURCE_CONTROL/.test(m)?'source-control-respected':/timeout|Timeout/.test(m)?'timeout':'runtime-error';}
          finally{clearTimeout(timer);if(browser){await browser.close().catch(()=>{});result.browserClosed=!browser.isConnected();}console.log(JSON.stringify(result));if(!result.countryVerified||!result.browserClosed)process.exitCode=1;}
          NODE
