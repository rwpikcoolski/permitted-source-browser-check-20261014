name: Vista published report directory
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: npm install --ignore-scripts --no-package-lock playwright@1.64.1
      - name: Verify USA and inspect public report directory
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const result={checkedAt:new Date().toISOString(),maximumBrowserSeconds:70,maximumSourceRequests:1,sourceRequests:0,rawRecordsLogged:false,browserClosed:false};let browser,timer;
          try {
            browser=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true});timer=setTimeout(()=>void browser.close().catch(()=>{}),70000);
            const context=await browser.newContext({acceptDownloads:false});const page=await context.newPage();
            const control=await page.goto('https://ipwho.is/',{waitUntil:'domcontentloaded',timeout:18000});const n=await control.json();
            if(control.status()!==200||n.success!==true||n.country_code!=='US'||Number(n.connection?.asn)===13335||/cloudflare/i.test(String(n.connection?.org||'')))throw Error('USA_NOT_VERIFIED');
            result.countryVerified='US';result.independentOfCloudflare=true;result.sourceRequests=1;
            const r=await context.request.get('https://gis.vista.gov/files/',{timeout:25000,maxRedirects:0});result.httpStatus=r.status();result.retryAfter=r.headers()['retry-after']||null;
            if([401,403,406,429].includes(r.status())||result.retryAfter){result.controlRespected=true;}else if(r.status()===200){const body=await r.text();if(body.length>1000000)throw Error('SIZE');result.directoryListing=/Index of|Directory Listing/i.test(body);result.links=[...body.matchAll(/href=["']([^"']+)["']/gi)].map(m=>{try{const u=new URL(m[1],'https://gis.vista.gov/files/');return u.origin==='https://gis.vista.gov'&&!u.search&&/permit|solar|building|cityworks/i.test(u.pathname)?u.href:null;}catch{return null;}}).filter(Boolean).slice(0,100);}
          }catch(e){result.failure=/USA_NOT_VERIFIED/.test(String(e.message))?'USA-not-verified':/timeout/i.test(String(e.message))?'timeout':'runtime-error';}
          finally{clearTimeout(timer);if(browser){await browser.close().catch(()=>{});result.browserClosed=!browser.isConnected();}console.log(JSON.stringify(result));if(!result.countryVerified||!result.browserClosed)process.exitCode=1;}
          NODE
