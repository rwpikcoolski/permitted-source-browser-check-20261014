name: Vista public permit layer coverage assessment

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install official browser test dependency
        run: |
          npm install --ignore-scripts --no-package-lock playwright@1.64.1
          npx playwright install --with-deps --no-shell chromium
      - name: Confirm installed official Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Verify U.S. network and test published public entry
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const report = {
            checkedAt: new Date().toISOString(),
            purpose: 'Public-source software transport acceptance only',
            maximumBrowserSeconds: 70,
            maximumSourceRequests: 20,
            sourceRequests: 0,
            sourceNavigationAttempts: 0,
            countryVerified: false,
            nonCloudflareNetworkVerified: false,
            snapshotsSaved: false,
            permitDataLogged: false,
            sourceStatus: null,
            sourcePageKind: 'not-visited',
            browserClosed: false
          };
          let browser, context, deadline;
          let stage = 'browser-start';
          try {
            browser = await chromium.launch({ channel: 'chrome', headless: true, chromiumSandbox: true });
            deadline = setTimeout(() => void browser.close().catch(() => {}), 70000);
            context = await browser.newContext({ acceptDownloads: false });
            const page = await context.newPage();
            page.setDefaultNavigationTimeout(30000);
            stage = 'browser-country-control';
            const control = await page.goto('https://www.cloudflare.com/cdn-cgi/trace', { waitUntil: 'domcontentloaded' });
            const trace = await page.locator('body').innerText();
            const country = trace.match(/(?:^|\n)loc=([A-Z]{2})\b/)?.[1];
            if (control?.status() !== 200 || country !== 'US') throw Error('USA_NOT_VERIFIED');
            stage = 'browser-network-control';
            const networkResponse = await page.goto('https://ipwho.is/', { waitUntil: 'domcontentloaded' });
            const network = await networkResponse.json();
            if (networkResponse?.status() !== 200 || network.success !== true || network.country_code !== 'US') throw Error('USA_NETWORK_NOT_VERIFIED');
            const asn = Number(network.connection?.asn);
            const organization = String(network.connection?.org || network.connection?.isp || '');
            if (!Number.isFinite(asn) || asn === 13335 || /cloudflare/i.test(organization)) throw Error('INDEPENDENT_NETWORK_NOT_VERIFIED');
            report.countryVerified = true;
            report.nonCloudflareNetworkVerified = true;
            report.networkKind = /microsoft|azure/i.test(organization) ? 'Microsoft/Azure' : 'independent-provider';
            console.log(JSON.stringify({ stage: 'ordinary-browser-USA-outside-Cloudflare-verified', sourceRequests: 0 }));
            stage='published-permit-layer';
            context.on('request',()=>{if(++report.sourceRequests>report.maximumSourceRequests)void context.close().catch(()=>{});});
            const base='https://app06.cityworksonline.com/CLIENT_VistaCA-Office/gis/16/4700/rest/services/cw/FeatureServer/5';
            const read=async(url)=>{report.sourceNavigationAttempts++;const r=await page.goto(url,{waitUntil:'domcontentloaded'});const status=r?.status();if([401,403,406,429].includes(status)||r?.headers()['retry-after'])throw Error('SOURCE_REFUSAL');if(status!==200)throw Error('SOURCE_HTTP');let d;try{d=await r.json()}catch{throw Error('SOURCE_NOT_JSON')};if(d.error){report.sourceError={code:d.error.code,message:String(d.error.message||'').slice(0,150)};throw Error('SOURCE_ERROR')};return d;};
            const meta=await read(base+'?f=pjson');
            report.sourceStatus=200;report.sourcePageKind='public-permit-layer-metadata';
            report.layer={name:meta.name,objectIdField:meta.objectIdField,capabilities:meta.capabilities,maxRecordCount:meta.maxRecordCount,supportedQueryFormats:meta.supportedQueryFormats,advancedQueryCapabilities:meta.advancedQueryCapabilities,fields:(meta.fields||[]).map(x=>({name:x.name,alias:x.alias,type:x.type,domain:x.domain?.codedValues?x.domain.codedValues.map(c=>({name:c.name,code:c.code})):undefined}))};
            const count=await read(base+'/query?'+new URLSearchParams({f:'json',where:'1=1',returnCountOnly:'true'}));report.recordCount=count.count;
            const dates=(meta.fields||[]).filter(x=>x.type==='esriFieldTypeDate').slice(0,12);
            if(dates.length&&meta.advancedQueryCapabilities?.supportsStatistics){const statistics=dates.map((x,i)=>({statisticType:'max',onStatisticField:x.name,outStatisticFieldName:'maximum_'+i}));const q=await read(base+'/query?'+new URLSearchParams({f:'json',where:'1=1',returnGeometry:'false',outStatistics:JSON.stringify(statistics)}));const a=q.features?.[0]?.attributes||{};report.maximumDates=dates.map((x,i)=>({field:x.name,value:a['maximum_'+i]}));}
          } catch (error) {
            report.failedStage = stage;
            report.errorKind = error?.name || 'Error';
            const detail = String(error?.message || '');
            report.errorCategory = /sandbox|SUID|namespace/i.test(detail) ? 'sandbox-startup-failure' : /Executable doesn.t exist/i.test(detail) ? 'browser-executable-missing' : /USA_NOT_VERIFIED/.test(detail) ? 'country-not-US' : /USA_NETWORK_NOT_VERIFIED/.test(detail) ? 'network-control-not-US' : /INDEPENDENT_NETWORK_NOT_VERIFIED/.test(detail) ? 'network-not-independent' : /net::ERR_CERT|certificate/i.test(detail) ? 'certificate-validation-failed' : /Timeout|timeout/.test(detail) ? 'navigation-timeout' : 'other-runtime-error';
            report.sourcePageKind = report.sourcePageKind === 'not-visited' && report.sourceNavigationAttempts ? 'navigation-failed' : report.sourcePageKind;
          } finally {
            clearTimeout(deadline);
            if (browser) {
              await browser.close().catch(() => {});
              report.browserClosed = !browser.isConnected();
            }
            console.log(JSON.stringify(report));
            if (!report.countryVerified || !report.nonCloudflareNetworkVerified || !report.browserClosed) process.exitCode = 1;
          }
          
          NODE
