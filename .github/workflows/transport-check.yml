name: Carlsbad free direct connection comparison
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  direct-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify USA and read public search metadata without a browser
        run: |
          node --input-type=module <<'NODE'
          const result={checkedAt:new Date().toISOString(),browserUsed:false,sourceRequests:0,rawRecordsLogged:false};
          try{
            const check=await fetch('https://ipwho.is/',{signal:AbortSignal.timeout(12000)});const n=await check.json();
            result.network={status:check.status,success:n.success===true,country:n.country_code||null,independentOfCloudflare:Number(n.connection?.asn)!==13335&&!/cloudflare/i.test(String(n.connection?.org||''))};
            if(check.status!==200||n.success!==true||n.country_code!=='US'||!result.network.independentOfCloudflare)throw Error('USA_NOT_VERIFIED');
            const url='https://eg.carlsbadca.gov/EnerGov_Prod/selfservice/api/energov/search/criteria';
            result.sourceRequests++;
            const response=await fetch(url,{redirect:'manual',headers:{tenantId:'1',tenantName:'CarlsbadCAProd','Tyler-TenantUrl':'CarlsbadCAProd',Accept:'application/json'},signal:AbortSignal.timeout(25000)});
            result.status=response.status;result.contentType=response.headers.get('content-type');result.retryAfter=response.headers.get('retry-after');
            if([401,403,406,429].includes(response.status)||result.retryAfter){result.controlRespected=true;await response.body?.cancel();}
            else {const text=await response.text();result.bytes=text.length;if(text.length>2000000)throw Error('SIZE_LIMIT');let j;try{j=JSON.parse(text)}catch{};result.accepted=response.status===200&&j?.Success===true;result.permitCriteriaPresent=!!j?.Result?.PermitCriteria;result.refusal=/you have been blocked|access denied|verify you are human/i.test(text);}
          }catch(e){result.failure=['USA_NOT_VERIFIED','SIZE_LIMIT'].includes(e.message)?e.message:e.name;}
          console.log(JSON.stringify(result));
          NODE
