name: Vista new hosted portal rendered-login acceptance

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install official browser test dependency
        run: |
          npm install --ignore-scripts --no-package-lock playwright@1.64.1
          npx playwright install --with-deps --no-shell chromium
      - name: Confirm installed official Chrome
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Verify U.S. network and test published public entry
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const report = {
            checkedAt: new Date().toISOString(),
            purpose: 'Public-source software transport acceptance only',
            maximumBrowserSeconds: 70,
            maximumSourceRequests: 256,
            sourceRequests: 0,
            sourceNavigationAttempts: 0,
            countryVerified: false,
            nonCloudflareNetworkVerified: false,
            snapshotsSaved: false,
            permitDataLogged: false,
            sourceStatus: null,
            sourcePageKind: 'not-visited',
            browserClosed: false
          };
          let browser, context, deadline;
          let stage = 'browser-start';
          try {
            browser = await chromium.launch({ channel: 'chrome', headless: true, chromiumSandbox: true });
            deadline = setTimeout(() => void browser.close().catch(() => {}), 70000);
            context = await browser.newContext({ acceptDownloads: false });
            const page = await context.newPage();
            page.setDefaultNavigationTimeout(30000);
            stage = 'browser-country-control';
            const control = await page.goto('https://www.cloudflare.com/cdn-cgi/trace', { waitUntil: 'domcontentloaded' });
            const trace = await page.locator('body').innerText();
            const country = trace.match(/(?:^|\n)loc=([A-Z]{2})\b/)?.[1];
            if (control?.status() !== 200 || country !== 'US') throw Error('USA_NOT_VERIFIED');
            stage = 'browser-network-control';
            const networkResponse = await page.goto('https://ipwho.is/', { waitUntil: 'domcontentloaded' });
            const network = await networkResponse.json();
            if (networkResponse?.status() !== 200 || network.success !== true || network.country_code !== 'US') throw Error('USA_NETWORK_NOT_VERIFIED');
            const asn = Number(network.connection?.asn);
            const organization = String(network.connection?.org || network.connection?.isp || '');
            if (!Number.isFinite(asn) || asn === 13335 || /cloudflare/i.test(organization)) throw Error('INDEPENDENT_NETWORK_NOT_VERIFIED');
            report.countryVerified = true;
            report.nonCloudflareNetworkVerified = true;
            report.networkKind = /microsoft|azure/i.test(organization) ? 'Microsoft/Azure' : 'independent-provider';
            console.log(JSON.stringify({ stage: 'ordinary-browser-USA-outside-Cloudflare-verified', sourceRequests: 0 }));
            stage = 'published-source-navigation';
            context.on('request', () => {
              report.sourceRequests++;
              if (report.sourceRequests > report.maximumSourceRequests) {
                report.requestLimitReached = true;
                void context.close().catch(() => {});
              }
            });
            report.sourceNavigationAttempts = 1;
            const response = await page.goto('https://app06.cityworksonline.com/CLIENT_VistaCA-public/login', { waitUntil: 'domcontentloaded' });
            report.sourceStatus = response?.status() ?? null;const destination=new URL(page.url());report.sourceDestination={origin:destination.origin,path:destination.pathname,hasQuery:Boolean(destination.search)};report.redirectCount=0;let prior=response?.request()?.redirectedFrom();while(prior){report.redirectCount++;prior=prior.redirectedFrom();}
            report.sourceRetryAfter = Boolean(response?.headers()['retry-after']);
            if ([401, 403, 406, 429].includes(report.sourceStatus) || report.sourceRetryAfter) {
              report.sourcePageKind = 'publisher-refusal';
            } else if (report.sourceStatus === 522) {
              report.sourcePageKind = 'origin-connection-timeout';
            } else if (report.sourceStatus >= 200 && report.sourceStatus < 300) {
              stage='published-login-render';await page.locator('input[type=password]').waitFor({state:'visible',timeout:15000});report.loginRendered=true;
              const view = await page.evaluate(() => {
                const text = document.body?.innerText || '';
                const links = [...document.querySelectorAll('a[href]')].flatMap(a => {
                  const label = String(a.innerText || a.textContent || '').trim().replace(/\s+/g,' ');
                  const u = new URL(a.href, location.href);
                  const cityHost = /(^|\.)vista\.gov$|(^|\.)cityofvista\.com$/i.test(u.hostname);
                  const cityLabel = /^(?:City of )?Vista(?:\s*,?\s*(?:CA|California))?$/i.test(label);
                  if (!['http:','https:'].includes(u.protocol) || (!cityHost && !cityLabel && !/participating|available|find your|map|jurisdiction|portal|permit|apply|search|cityworks|solarapp/i.test(label+' '+u.pathname)) || /chula vista/i.test(label)) return [];
                  if (/caseid|recordid|permitid|applicationid|token|secret|key=/i.test(u.href)) return [];
                  return [{label:label.length<100?label:'Public navigation link',url:u.origin+u.pathname,hasQuery:Boolean(u.search)}];
                });
                const vistaNodes=[...document.querySelectorAll('a,span,h2,h3,h4,p,div')].filter(e=>/^(?:City of )?Vista(?:\s*,?\s*(?:CA|California))?$/i.test((e.innerText||'').trim())).slice(0,5);const vistaRows=vistaNodes.map(e=>{const row=e.closest('.w-dyn-item')||e.parentElement;return{nodeTag:e.tagName,collectionRow:Boolean(e.closest('.w-dyn-item')),publishedLinks:[...row.querySelectorAll('a[href]')].flatMap(a=>{const u=new URL(a.href,location.href);return ['https:','http:'].includes(u.protocol)&&!/caseid|recordid|permitid|applicationid|token|secret|key=/i.test(u.href)?[{label:(a.innerText||'').trim().slice(0,100),url:u.origin+u.pathname,hasQuery:Boolean(u.search)}]:[]})};});const frames=[...document.querySelectorAll('iframe')].map(f=>{const src=f.getAttribute('src')||'';let origin=null,path=null;try{const u=new URL(src,location.href);if(['http:','https:'].includes(u.protocol)){origin=u.origin;path=u.pathname;}}catch{}const r=f.getBoundingClientRect();return{srcPresent:Boolean(src),srcdocPresent:f.hasAttribute('srcdoc'),origin,path,visible:r.width>0&&r.height>0};});return {passwordFieldPresent:Boolean(document.querySelector('input[type=password]')),vistaRows,title:document.title.slice(0,150),heading:[...document.querySelectorAll('h1,h2')].map(h=>(h.innerText||'').slice(0,100)).slice(0,6),textLength:text.length,frames,challengeWording:/verify you are human|checking your browser|access denied/i.test(text),vistaWordPresent:/\bVista\b/i.test(text),explicitVistaCityWording:/city of vista|vista,?\s+(?:ca|california)/i.test(text),links:[...new Map(links.map(x=>[x.url,x])).values()].slice(0,20),selectCount:document.querySelectorAll('select').length,iframeCount:document.querySelectorAll('iframe').length};
              });
              report.sourcePageKind = view.challengeWording ? 'publisher-challenge' : 'rendered-city-published-hosted-entry';
              report.passwordFieldPresent=view.passwordFieldPresent;report.pageIdentity={title:view.title,headings:view.heading,textLength:view.textLength,frames:view.frames};
              report.vistaWordPresent = view.vistaWordPresent;
              report.explicitVistaCityWording = view.explicitVistaCityWording;
              report.publishedNavigationLinks = view.challengeWording ? [] : view.links;
              report.selectCount = view.selectCount;report.iframeCount = view.iframeCount;
            } else {
              report.sourcePageKind = 'other-http-response';
            }
          } catch (error) {
            report.failedStage = stage;
            report.errorKind = error?.name || 'Error';
            const detail = String(error?.message || '');
            report.errorCategory = /sandbox|SUID|namespace/i.test(detail) ? 'sandbox-startup-failure' : /Executable doesn.t exist/i.test(detail) ? 'browser-executable-missing' : /USA_NOT_VERIFIED/.test(detail) ? 'country-not-US' : /USA_NETWORK_NOT_VERIFIED/.test(detail) ? 'network-control-not-US' : /INDEPENDENT_NETWORK_NOT_VERIFIED/.test(detail) ? 'network-not-independent' : /net::ERR_CERT|certificate/i.test(detail) ? 'certificate-validation-failed' : /Timeout|timeout/.test(detail) ? 'navigation-timeout' : 'other-runtime-error';
            report.sourcePageKind = report.sourcePageKind === 'not-visited' && report.sourceNavigationAttempts ? 'navigation-failed' : report.sourcePageKind;
          } finally {
            clearTimeout(deadline);
            if (browser) {
              await browser.close().catch(() => {});
              report.browserClosed = !browser.isConnected();
            }
            console.log(JSON.stringify(report));
            if (!report.countryVerified || !report.nonCloudflareNetworkVerified || !report.browserClosed) process.exitCode = 1;
          }
          NODE
