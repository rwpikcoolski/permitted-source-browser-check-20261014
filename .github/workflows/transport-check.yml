name: Vista SolarAPP public access acceptance

on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify U.S. network and assess the City-published SolarAPP pages
        run: |
          node --input-type=module <<'NODE'
          const report={checkedAt:new Date().toISOString(),purpose:'Published SolarAPP public-page software access assessment',maximumOperationSeconds:70,maximumSourceRequests:2,sourceRequests:0,countryVerified:false,nonCloudflareNetworkVerified:false,permitDataLogged:false,snapshotsSaved:false,pages:[]};
          const deadline=AbortSignal.timeout(70000);let stage='network-control';
          try {
           const c=await fetch('https://ipwho.is/',{signal:deadline}); const n=await c.json();
           const asn=Number(n.connection?.asn);const org=String(n.connection?.org||n.connection?.isp||'');
           if(c.status!==200||n.success!==true||n.country_code!=='US')throw Error('USA_NOT_VERIFIED');
           if(!Number.isFinite(asn)||asn<=0||asn===13335||!org||/cloudflare/i.test(org))throw Error('INDEPENDENT_NETWORK_NOT_VERIFIED');
           report.countryVerified=true;report.nonCloudflareNetworkVerified=true;report.networkKind=/microsoft|azure/i.test(org)?'Microsoft/Azure':'independent-provider';
           for(const url of ['https://www.gosolarapp.org/','https://gosolarapp.org/login']){
            stage='published-program-page';report.sourceRequests++;
            const r=await fetch(url,{signal:deadline}); const page={requestedPage:new URL(url).pathname,status:r.status,retryAfter:Boolean(r.headers.get('retry-after')),finalOrigin:new URL(r.url).origin,finalPath:new URL(r.url).pathname};
            if([401,403,406,429].includes(r.status)||page.retryAfter){await r.body?.cancel();page.pageKind='publisher-refusal';report.pages.push(page);break;}
            if(!r.ok){await r.body?.cancel();page.pageKind='other-http-response';report.pages.push(page);continue;}
            const reader=r.body.getReader();let size=0;const chunks=[];
            while(true){const v=await reader.read();if(v.done)break;size+=v.value.length;if(size>2097152){await reader.cancel();throw Error('RESPONSE_LIMIT');}chunks.push(v.value);}
            const text=Buffer.concat(chunks).toString('utf8');page.pageKind='public-program-page';page.loginFormPresent=/type\s*=\s*['"]password['"]/i.test(text);page.explicitPublicPermitSearchWording=/public permit search|search permits|browse permits/i.test(text);page.challengeWording=/verify you are human|access denied|checking your browser/i.test(text);
            const links=[];for(const m of text.matchAll(/href\s*=\s*["']([^"'<>]+)["']/gi)){
             try{const u=new URL(m[1].replace(/&amp;/gi,'&'),r.url);if(u.protocol!=='https:'||!/permit|project|dashboard|api|login|sign-up|jurisdiction/i.test(u.pathname))continue;if(/caseid|recordid|permitid|applicationid|token|secret|key=/i.test(u.href))continue;links.push({url:u.origin+u.pathname,hasQuery:Boolean(u.search)});}catch{}
            }
            page.publishedLinks=page.challengeWording?[]:[...new Map(links.map(x=>[x.url,x])).values()].slice(0,20);
            page.scriptPaths=[...text.matchAll(/<script[^>]+src\s*=\s*['"]([^'"]+)['"]/gi)].flatMap(m=>{try{const u=new URL(m[1],r.url);return u.protocol==='https:'&&/gosolarapp\.org$/.test(u.hostname)?[u.origin+u.pathname]:[];}catch{return[];}}).slice(0,5);
            report.pages.push(page);if(page.challengeWording)break;
           }
          }catch(e){report.failedStage=stage;report.errorKind=e.name;report.errorCategory=/USA_NOT_VERIFIED/.test(String(e.message))?'country-not-US':/INDEPENDENT_NETWORK_NOT_VERIFIED/.test(String(e.message))?'network-not-independent':/Timeout|Abort/.test(e.name)?'operation-deadline':/RESPONSE_LIMIT/.test(String(e.message))?'response-boundary':'other-runtime-error';}
          finally{console.log(JSON.stringify(report));if(!report.countryVerified||!report.nonCloudflareNetworkVerified)process.exitCode=1;}
          
          NODE
