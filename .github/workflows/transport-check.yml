name: Carlsbad recent permit dates
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: npm install --ignore-scripts --no-package-lock playwright@1.64.1
      - name: Verify USA and open published Carlsbad portal normally
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const result={checkedAt:new Date().toISOString(),maximumBrowserSeconds:70,maximumSourceRequests:160,sourceRequests:0,rawRecordsLogged:false,browserClosed:false};let browser,timer;
          try {
            browser=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true});timer=setTimeout(()=>void browser.close().catch(()=>{}),70000);
            const context=await browser.newContext({acceptDownloads:false});const page=await context.newPage();
            const control=await page.goto('https://ipwho.is/',{waitUntil:'domcontentloaded',timeout:18000});const n=await control.json();
            result.networkCheck={status:control.status(),success:n.success===true,country:n.country_code||null,network:n.connection?.org||null};if(control.status()!==200||n.success!==true||n.country_code!=='US'||Number(n.connection?.asn)===13335||/cloudflare/i.test(String(n.connection?.org||'')))throw Error('USA_NOT_VERIFIED');
            result.countryVerified='US';result.independentOfCloudflare=true;
            context.on('request',()=>{result.sourceRequests++;if(result.sourceRequests>160)void context.close().catch(()=>{});});
            result.requests=[];page.on('request',r=>{if(r.resourceType()==='xhr'||r.resourceType()==='fetch'){const u=new URL(r.url());if(u.hostname==='eg.carlsbadca.gov'){const h=r.headers();result.requests.push({path:u.pathname,method:r.method(),tenant:{tenantId:h.tenantid,tenantName:h.tenantname,tenantUrl:h['tyler-tenanturl']}});}}});
            const r=await page.goto('https://eg.carlsbadca.gov/EnerGov_Prod/selfservice/CarlsbadCAProd',{waitUntil:'domcontentloaded',timeout:25000});result.httpStatus=r.status();result.retryAfter=r.headers()['retry-after']||null;
            if([401,403,406,429].includes(r.status())||result.retryAfter){result.controlRespected=true;}else if(r.status()===200){await page.locator('a[href$="#/search"]:visible').first().waitFor({timeout:20000});await page.locator('a[href$="#/search"]:visible').first().click();await page.locator('#SearchModule').waitFor({timeout:15000});await page.waitForLoadState('networkidle',{timeout:8000}).catch(()=>{});await page.locator('#SearchModule').selectOption('number:2');await page.locator('#SearchKeyword').fill('solar');const found=page.waitForResponse(r=>/api\/energov\/search\/search$/i.test(new URL(r.url()).pathname),{timeout:20000});await page.locator('#button-Search').click();const sr=await found;result.searchStatus=sr.status();if(!sr.ok())throw Error('PUBLIC_SEARCH_FAILED');const sj=await sr.json();const data=sj.Result||{};result.search={success:sj.Success,keys:Object.keys(data)};const arrays=Object.entries(data).filter(([,v])=>Array.isArray(v));result.search.arrays=arrays.map(([key,rows])=>({key,count:rows.length,fields:rows[0]&&typeof rows[0]==='object'?Object.keys(rows[0]):[]}));result.search.counts=Object.fromEntries(Object.entries(data).filter(([k,v])=>/total|count|page/i.test(k)&&typeof v==='number'));result.search.dates=arrays.flatMap(([key,rows])=>{const dates={};for(const r of rows)if(r&&typeof r==='object')for(const [k,v] of Object.entries(r))if(/applydate|issuedate|finaldate/i.test(k)&&typeof v==='string')dates[k]=[...(dates[k]||[]),v];return Object.entries(dates).map(([field,values])=>({key,field,min:values.sort()[0],max:values.sort().at(-1)}));});await page.locator('#button-Advanced').click();await page.locator('#PermitCriteria_SortBy').selectOption('string:IssueDate');await page.locator('#SortAscending').selectOption('boolean:false');const recentResponse=page.waitForResponse(r=>/api\/energov\/search\/search$/i.test(new URL(r.url()).pathname),{timeout:15000});await page.locator('#button-Search').click();const rr=await recentResponse;const rd=await rr.json();const rows=rd.Result?.EntityResults||[];result.recent={status:rr.status(),success:rd.Success,count:rd.Result?.TotalFound,pageRows:rows.length,dates:['ApplyDate','IssueDate'].map(field=>({field,values:rows.map(r=>r[field]).filter(Boolean).sort()})),types:[...new Set(rows.map(r=>r.CaseType))],workClasses:[...new Set(rows.map(r=>r.CaseWorkclass))],statuses:[...new Set(rows.map(r=>r.CaseStatus))],request:rr.request().postDataJSON()};result.finalRoute=new URL(page.url()).hash;result.view=await page.evaluate(()=>{const body=document.body?.innerText||'';const safe=u=>!/[?&](?:id|permit|case|record|token|secret|key)/i.test(u);return{title:document.title,challenge:/verify you are human|access denied|you have been blocked/i.test(body),login:!!document.querySelector('input[type=password]'),search:/search/i.test(body),links:[...document.querySelectorAll('a[href]')].flatMap(a=>{const u=new URL(a.href,location.href);return /^https?:$/.test(u.protocol)&&safe(u.href)&&/search|permit|home|login|log in|sign in|guest/i.test((a.textContent||'')+u.pathname)?[{label:(a.textContent||'').trim().slice(0,80),url:u.href}]:[];}).slice(0,30),controls:[...document.querySelectorAll('input,select,button')].filter(e=>!e.closest('.skiptranslate')&&!/goog-|Language/i.test(e.id+' '+e.getAttribute('aria-label'))).map(e=>({tag:e.tagName,id:e.id,type:e.type,label:e.getAttribute('aria-label')||e.getAttribute('placeholder')||e.innerText?.trim().slice(0,80),options:e.tagName==='SELECT'?[...e.options].map(o=>({text:o.text,value:o.value})).slice(0,80):undefined})).slice(0,180),scripts:[...document.scripts].map(s=>s.src).filter(s=>s&&safe(s)).slice(0,30)};});}
          }catch(e){result.failure=/USA_NOT_VERIFIED/.test(String(e.message))?'USA-not-verified':/timeout/i.test(String(e.message))?'timeout':'runtime-error';}
          finally{clearTimeout(timer);if(browser){await browser.close().catch(()=>{});result.browserClosed=!browser.isConnected();}console.log(JSON.stringify(result));if(!result.countryVerified||!result.browserClosed)process.exitCode=1;}
          NODE
