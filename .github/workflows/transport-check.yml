name: Vista published guide link acceptance

on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify U.S. network and read exact public guide bytes
        run: |
          node --input-type=module <<'NODE'
          import { gunzipSync } from 'node:zlib';
          const report={checkedAt:new Date().toISOString(),purpose:'Public guide link extraction for software source assessment',maximumOperationSeconds:70,maximumSourceRequests:2,sourceRequests:0,browserUsed:false,countryVerified:false,nonCloudflareNetworkVerified:false,permitDataLogged:false,snapshotsSaved:false,sourcePageKind:'not-read'};
          const deadline=AbortSignal.timeout(70000); let stage='network-control';
          try {
           const control=await fetch('https://ipwho.is/',{signal:deadline}); const n=await control.json();
           if(control.status!==200||n.success!==true||n.country_code!=='US')throw Error('USA_NOT_VERIFIED');
           const asn=Number(n.connection?.asn);const org=String(n.connection?.org||n.connection?.isp||'');
           if(!Number.isFinite(asn)||asn===13335||/cloudflare/i.test(org))throw Error('INDEPENDENT_NETWORK_NOT_VERIFIED');
           report.countryVerified=true;report.nonCloudflareNetworkVerified=true;report.networkKind=/microsoft|azure/i.test(org)?'Microsoft/Azure':'independent-provider';
           stage='published-guide-bytes';report.sourceRequests=1;
           const expectedLength=34489;
           const r=await fetch('https://data.commoncrawl.org/crawl-data/CC-MAIN-2026-34/segments/1786091385821.41/warc/CC-MAIN-20260815060346-20260815090346-00733.warc.gz',{headers:{Range:'bytes=937953827-937988315'},signal:deadline});
           report.sourceStatus=r.status;report.sourceRetryAfter=Boolean(r.headers.get('retry-after'));
           if(r.status!==206||report.sourceRetryAfter||Number(r.headers.get('content-length'))!==expectedLength){report.sourcePageKind='range-not-accepted';await r.body?.cancel();}
           else {
            const reader=r.body.getReader();let size=0;const chunks=[];
            while(true){const p=await reader.read();if(p.done)break;size+=p.value.length;if(size>expectedLength){await reader.cancel();throw Error('RESPONSE_LIMIT');}chunks.push(p.value);}
            if(size!==expectedLength)throw Error('INCOMPLETE_RANGE');
            const raw=gunzipSync(Buffer.concat(chunks),{maxOutputLength:2097152}).toString('utf8');
            report.sourcePageKind='public-guide-links';report.guideCaptureAt='2026-08-15T06:21:29Z';
            const links=[];
            for(const m of raw.matchAll(/href\s*=\s*["']([^"'<>]+)["']/gi)){
             const href=m[1].replace(/&amp;/gi,'&').replace(/&#(\d+);/g,(_,v)=>String.fromCharCode(Number(v)));
             try {const u=new URL(href,'https://www.vista.gov/city-services/community-development/permits-forms/solarapp');
              if(!['https:','http:'].includes(u.protocol)||!/cityworks|solarapp|permit portal|online permit/i.test(u.hostname+u.pathname))continue;
              if(/caseid|recordid|permitid|applicationid|token|secret|key=/i.test(u.href))continue;
              links.push({url:u.origin+u.pathname,hasQuery:Boolean(u.search)});
             }catch{}
            }
            report.publishedPortalLinks=[...new Map(links.map(x=>[x.url,x])).values()].slice(0,20);
           }
          }catch(e){report.failedStage=stage;report.errorKind=e.name;report.errorCategory=/USA_NOT_VERIFIED/.test(String(e.message))?'country-not-US':/INDEPENDENT_NETWORK_NOT_VERIFIED/.test(String(e.message))?'network-not-independent':/Timeout|Abort/.test(e.name)?'operation-deadline':/RESPONSE_LIMIT|INCOMPLETE_RANGE/.test(String(e.message))?'response-boundary':'other-runtime-error';}
          finally{console.log(JSON.stringify(report));if(!report.countryVerified||!report.nonCloudflareNetworkVerified)process.exitCode=1;}
          
          NODE
