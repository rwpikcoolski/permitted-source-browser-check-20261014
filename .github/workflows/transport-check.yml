name: Vista published map source metadata
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install official browser dependency
        run: npm install --ignore-scripts --no-package-lock playwright@1.64.1
      - name: Inspect public map source metadata
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const result={purpose:'Inspect data sources explicitly linked by public Vista maps; metadata only',checkedAt:new Date().toISOString(),maximumBrowserSeconds:70,maximumSourceRequests:3,sourceRequests:0,browserClosed:false,rawRecordsLogged:false,results:[]};
          let browser,timer;
          try{
           browser=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true});timer=setTimeout(()=>void browser.close().catch(()=>{}),70000);
           const context=await browser.newContext({acceptDownloads:false});const page=await context.newPage();
           const control=await page.goto('https://ipwho.is/',{waitUntil:'domcontentloaded',timeout:18000});const n=await control.json();
           if(control.status()!==200||n.success!==true||n.country_code!=='US'||Number(n.connection?.asn)===13335||/cloudflare/i.test(String(n.connection?.org||'')))throw Error('USA_NOT_VERIFIED');
           result.countryVerified='US';result.independentOfCloudflare=true;
           const sources=[{label:'public-plan-index',url:'https://gis.vista.gov/arcgis/rest/services/Hosted/Plan_Index_Data/FeatureServer/0'},{label:'public-planning-projects-view',url:'https://services3.arcgis.com/z9GvP47f4vbAXFVB/arcgis/rest/services/PlanningProjects_Points_view/FeatureServer'}];
           for(let i=0;i<sources.length&&result.sourceRequests<3;i++){
            const item=sources[i];result.sourceRequests++;const r=await context.request.get(item.url+'?f=pjson',{timeout:18000,maxRedirects:0});const out={label:item.label,httpStatus:r.status(),retryAfter:r.headers()['retry-after']||null};result.results.push(out);
            if([401,403,406,429].includes(r.status())||out.retryAfter){out.controlRespected=true;break;}
            const text=await r.text();if(text.length>1000000)throw Error('SIZE');let j;try{j=JSON.parse(text)}catch{out.format='not-json';continue;}
            if(j.error){out.error={code:j.error.code,message:j.error.message};continue;}
            out.name=j.name;out.fields=j.fields?.map(f=>({name:f.name,alias:f.alias,type:f.type}));out.description=j.description?.slice(0,1600);out.layers=j.layers?.map(l=>({id:l.id,name:l.name}));
            if(item.label==='public-planning-projects-view'&&j.layers?.length===1){sources.push({label:'public-planning-projects-view-layer',url:item.url+'/'+j.layers[0].id});}
           }
          }catch(e){const m=String(e?.message||'');result.failure=/USA_NOT_VERIFIED/.test(m)?'USA-not-verified':/timeout|Timeout/.test(m)?'timeout':'runtime-error';}
          finally{clearTimeout(timer);if(browser){await browser.close().catch(()=>{});result.browserClosed=!browser.isConnected();}console.log(JSON.stringify(result));if(!result.countryVerified||!result.browserClosed)process.exitCode=1;}
          NODE
