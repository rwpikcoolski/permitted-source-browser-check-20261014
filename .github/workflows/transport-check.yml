name: Vista separate public inspection publication
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: public-source-transport-acceptance
  cancel-in-progress: false
jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install official browser dependency
        run: npm install --ignore-scripts --no-package-lock playwright@1.64.1
      - name: Assess only public source metadata and aggregates
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          const result={purpose:'Assess separately published daily inspection source; no records logged',checkedAt:new Date().toISOString(),maximumBrowserSeconds:70,maximumSourceRequests:1,sourceRequests:0,browserClosed:false,rawRecordsLogged:false};
          let browser,timer;
          try{
           browser=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true});
           timer=setTimeout(()=>void browser.close().catch(()=>{}),70000);
           const context=await browser.newContext({acceptDownloads:false});const page=await context.newPage();
           const control=await page.goto('https://ipwho.is/',{waitUntil:'domcontentloaded',timeout:20000});
           const network=await control.json();
           if(control.status()!==200||network.success!==true||network.country_code!=='US'||Number(network.connection?.asn)===13335||/cloudflare/i.test(String(network.connection?.org||'')))throw Error('USA_NETWORK_NOT_VERIFIED');
           result.countryVerified='US';result.independentOfCloudflare=true;
           result.sourceRequests++;
           const response=await context.request.get('https://gis.vista.gov/files/Vista_Bld_Permit_Inspection_Results.xlsx',{timeout:22000,maxRedirects:0});
           result.httpStatus=response.status();result.lastModified=response.headers()['last-modified']||null;
           if([401,403,406,429].includes(response.status())||response.headers()['retry-after'])throw Error('SOURCE_CONTROL');
           if(response.status()!==200)throw Error('SOURCE_HTTP');
           const bytes=await response.body();result.bytes=bytes.length;if(bytes.length>3000000)throw Error('SIZE_BOUND');
           const filename=path.join(os.tmpdir(),'vista-public-inspections-'+process.pid+'.xlsx');
           const parser=String.raw`import json,sys,zipfile,xml.etree.ElementTree as E,re
          from datetime import datetime,timedelta
          from urllib.parse import urlparse
          n={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          with zipfile.ZipFile(sys.argv[1]) as z:
           if sum(x.file_size for x in z.infolist())>20000000:raise ValueError('size')
           ss=[''.join(x.itertext()) for x in E.fromstring(z.read('xl/sharedStrings.xml')).findall('m:si',n)] if 'xl/sharedStrings.xml' in z.namelist() else []
           rows=[]
           for row in E.fromstring(z.read('xl/worksheets/sheet1.xml')).findall('.//m:sheetData/m:row',n):
            cells={}
            for c in row.findall('m:c',n):
             col=re.sub('[0-9]','',c.attrib.get('r',''));v=c.find('m:v',n);v=v.text if v is not None else ''
             if c.attrib.get('t')=='s':v=ss[int(v)] if v else ''
             elif c.attrib.get('t')=='inlineStr':v=''.join(c.find('m:is',n).itertext())
             cells[col]=v or ''
            rows.append(cells)
           head=next(((i,r) for i,r in enumerate(rows[:12]) if any('PERMIT' in v.upper() for v in r.values()) and sum(bool(re.search('DATE|RESULT|INSPECTION|NUMBER|ADDRESS|DESCRIPTION|STATUS',v,re.I)) for v in r.values())>=2),None)
           out={'rows':len(rows),'headerLocated':head is not None,'externalHyperlinkOrigins':[]}
           if head:
            out['headers']=list(head[1].values());records=rows[head[0]+1:];out['dataRows']=len(records)
            out['solarTextRows']=sum(bool(re.search(r'\b(solar|pv|photovoltaic)\b',' '.join(r.values()),re.I)) for r in records)
            out['dateColumns']={}
            for col,name in head[1].items():
             if 'DATE' not in name.upper():continue
             found=[]
             for r in records:
              value=r.get(col,'')
              if not value:continue
              try:
               num=float(value)
               if 20000<num<100000:found.append((datetime(1899,12,30)+timedelta(days=num)).date().isoformat());continue
              except ValueError:pass
              for fmt in ['%m/%d/%Y','%Y-%m-%d','%m/%d/%Y %H:%M:%S','%m/%d/%Y %I:%M:%S %p']:
               try:found.append(datetime.strptime(value,fmt).date().isoformat());break
               except ValueError:pass
             out['dateColumns'][name]={'parsedDates':len(found),'latest':max(found) if found else None}
           out['reportPrintedDates']=[v for r in rows[:head[0] if head else 2] for v in r.values() if 'Report Generated' in v]
           origins=set()
           for f in z.namelist():
            if f.endswith('.rels'):
             for rel in E.fromstring(z.read(f)):
              if rel.attrib.get('TargetMode')=='External':
               p=urlparse(rel.attrib.get('Target',''))
               if p.scheme in ['http','https']:origins.add(p.scheme+'://'+p.netloc)
           out['externalHyperlinkOrigins']=sorted(origins)
           print(json.dumps(out))`;
           try{fs.writeFileSync(filename,bytes,{mode:0o600});const parsed=spawnSync('python3',['-c',parser,filename],{encoding:'utf8',timeout:10000,maxBuffer:50000});if(parsed.status!==0)throw Error('WORKBOOK_SCHEMA');result.assessment=JSON.parse(parsed.stdout);}finally{try{fs.unlinkSync(filename)}catch{}}
          }catch(error){const message=String(error?.message||'');result.failure=/USA_NETWORK_NOT_VERIFIED/.test(message)?'country-or-independent-network-not-verified':/SOURCE_CONTROL/.test(message)?'source-control-respected':/Timeout|timeout/.test(message)?'timeout':/WORKBOOK_SCHEMA/.test(message)?'workbook-schema-rejected':'source-or-runtime-error';}
          finally{clearTimeout(timer);if(browser){await browser.close().catch(()=>{});result.browserClosed=!browser.isConnected();}console.log(JSON.stringify(result));if(!result.browserClosed||!result.assessment)process.exitCode=1;}
          NODE
